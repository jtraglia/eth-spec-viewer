name: Tag Update

on:
  schedule:
    - cron: "0 0 * * *" # Runs nightly at midnight UTC
  workflow_dispatch: # Allow manual runs

jobs:
  check-and-process-tags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6

      # --- consensus-specs: build each git tag from source ---

      - name: Clone Consensus Specs
        run: |
          git clone https://github.com/ethereum/consensus-specs.git

      - name: Get All Tags
        id: get-tags
        run: |
          cd consensus-specs
          git fetch --tags
          # Get all tags sorted by version
          TAGS=$(git tag -l | sort -V)
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check Processed Tags
        id: check-processed
        run: |
          # Create the consensus specs directory if it doesn't exist
          mkdir -p specs/consensus

          # Get list of already processed tags
          PROCESSED_TAGS=$(ls specs/consensus/ 2>/dev/null || echo "")
          echo "processed<<EOF" >> $GITHUB_OUTPUT
          echo "$PROCESSED_TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Process New Tags
        run: |
          cd consensus-specs

          # Convert multiline strings to arrays
          readarray -t ALL_TAGS <<< "${{ steps.get-tags.outputs.tags }}"
          readarray -t PROCESSED <<< "${{ steps.check-processed.outputs.processed }}"

          # Process each tag
          for tag in "${ALL_TAGS[@]}"; do
            if [[ -z "$tag" ]]; then continue; fi

            # Skip tags before v1.6.0-alpha.2
            # Use Python's packaging.version for proper semantic version comparison
            MIN_VERSION="v1.6.0-alpha.2"
            SKIP=$(python3 -c "from packaging import version; import sys; min_ver = version.parse('$MIN_VERSION'.lstrip('v')); tag_ver = version.parse('$tag'.lstrip('v')); print('1' if tag_ver < min_ver else '0')")
            if [[ "$SKIP" == "1" ]]; then
              echo "Skipping old tag: $tag (before v1.6.0-alpha.2)"
              continue
            fi

            # Check if tag was already processed
            if [[ " ${PROCESSED[@]} " =~ " ${tag} " ]]; then
              echo "Tag $tag already processed, skipping..."
              continue
            fi

            echo "Processing new tag: $tag"

            # Clean up any modifications from previous tag
            git reset --hard
            git clean -fd

            # Checkout the tag
            git checkout "$tag"

            # Apply patch
            git apply ../write_pyspec_dict.patch

            # Build pyspec
            make _pyspec

            # Create tag directory and copy files
            mkdir -p "../specs/consensus/$tag"
            cp pyspec.json "../specs/consensus/$tag/spec.json"

            # Record the tagged commit's date for version ordering
            echo "$tag=$(git log -1 --format=%cI)" >> /tmp/consensus-dates.txt
          done

      # --- execution-specs: build each published release from its source tarball ---

      - name: Process New Execution Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p specs/execution

          # execution-specs publishes releases constantly - mostly fixture
          # bundles (tests-*) cut from devnet branches, each carrying the spec
          # tree of its branch. A floor keeps the viewer from backfilling years
          # of them. Deliberately a date rather than a count, so newly
          # published releases are picked up on their own; raise it to drop
          # older versions.
          MIN_RELEASE_DATE="2026-07-15"

          gh api --paginate repos/ethereum/execution-specs/releases \
            --jq '.[] | select(.draft==false) | [.published_at, .tag_name] | @tsv' \
            | awk -F'\t' -v min="$MIN_RELEASE_DATE" '$1 >= min' \
            | sort -r | cut -f2 > /tmp/exec-releases.txt

          echo "Releases published on or after $MIN_RELEASE_DATE:"
          cat /tmp/exec-releases.txt

          while IFS= read -r tag; do
            if [[ -z "$tag" ]]; then continue; fi

            if [[ -d "specs/execution/$tag" ]]; then
              echo "Release $tag already processed, skipping..."
              continue
            fi

            echo "Processing new release: $tag"

            # A tag points at a commit, so the branch it was cut from does not
            # matter; the auto-generated source tarball is enough
            curl -fsSL \
              "https://github.com/ethereum/execution-specs/archive/refs/tags/${tag}.tar.gz" \
              -o /tmp/exec-src.tar.gz
            rm -rf /tmp/exec-src
            mkdir -p /tmp/exec-src
            tar xzf /tmp/exec-src.tar.gz -C /tmp/exec-src --strip-components=1

            python3 scripts/extract_execution_specs.py \
              /tmp/exec-src "specs/execution/$tag/spec.json"
          done < /tmp/exec-releases.txt

          # Drop versions no longer selected, i.e. ones now older than the
          # cutoff, so the directory tracks the filter
          for dir in specs/execution/*/; do
            name=$(basename "$dir")
            if [[ "$name" == "nightly" ]]; then continue; fi
            if ! grep -qxF "$name" /tmp/exec-releases.txt; then
              echo "Removing superseded version: $name"
              rm -rf "$dir"
            fi
          done

          # Record each release's commit date so versions.json can be ordered
          # by when the snapshot was actually cut
          : > /tmp/exec-dates.txt
          while IFS= read -r tag; do
            if [[ -z "$tag" ]]; then continue; fi
            date=$(gh api "repos/ethereum/execution-specs/commits/$tag" \
              --jq '.commit.committer.date')
            echo "$tag=$date" >> /tmp/exec-dates.txt
          done < /tmp/exec-releases.txt

          EXEC_DATES=()
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then EXEC_DATES+=("$line"); fi
          done < /tmp/exec-dates.txt

          python3 scripts/update_versions.py specs/execution "${EXEC_DATES[@]}"

      - name: Update Consensus versions.json
        run: |
          # Dates for tags built this run; tags built previously are already
          # recorded in versions.json and carried forward
          touch /tmp/consensus-dates.txt
          TAG_DATES=()
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then TAG_DATES+=("$line"); fi
          done < /tmp/consensus-dates.txt

          python3 scripts/update_versions.py specs/consensus "${TAG_DATES[@]}"

      # Both repos are committed together in a single push, so this cannot race
      # itself the way two separate workflows writing to specs/ would.
      - name: Commit and Push Changes
        # Still runs when a build step failed, so one broken upstream does not
        # hold back the other repo's new versions.
        if: ${{ !cancelled() }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Remove the cloned consensus-specs directory
          rm -rf consensus-specs/

          # Staging first so the check covers new files as well as modified ones
          git add specs/

          if git diff --cached --quiet; then
            echo "No new versions detected. Skipping commit."
          else
            git commit -m "Add tagged spec versions"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
