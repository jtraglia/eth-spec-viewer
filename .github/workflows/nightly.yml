name: Nightly Update

on:
  schedule:
    - cron: "0 0 * * *" # Runs nightly at midnight UTC
  workflow_dispatch: # Allow manual runs

jobs:
  update-specs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6

      # --- consensus-specs ---

      - name: Clone Consensus Specs
        run: |
          git clone https://github.com/ethereum/consensus-specs.git

      - name: Apply Patch to Consensus Specs
        run: |
          cd consensus-specs
          git apply ../write_pyspec_dict.patch

      - name: Build Consensus Spec JSON
        run: |
          mkdir -p specs/consensus/nightly
          cd consensus-specs
          make _pyspec
          cp pyspec.json ../specs/consensus/nightly/spec.json
          cd ..
          # Date the snapshot by the upstream commit it was built from
          python3 scripts/update_versions.py specs/consensus \
            "nightly=$(git -C consensus-specs log -1 --format=%cI)"

      # --- execution-specs ---

      - name: Clone Execution Specs
        run: |
          # Only the spec packages are needed; the repo also carries the test
          # suite, which is far larger than the specs themselves
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/ethereum/execution-specs.git
          cd execution-specs
          git sparse-checkout set src/ethereum

      - name: Build Execution Spec JSON
        run: |
          python3 scripts/extract_execution_specs.py \
            execution-specs specs/execution/nightly/spec.json
          # Date the snapshot by the upstream commit it was built from
          python3 scripts/update_versions.py specs/execution \
            "nightly=$(git -C execution-specs log -1 --format=%cI)"

      # Both repos are committed together in a single push. Running them as two
      # workflows on the same schedule meant whichever pushed second was
      # rejected as non-fast-forward on any night both had changes.
      - name: Commit and Push Changes
        # Still runs when a build step failed, so a broken upstream on one side
        # does not hold back the other side's update. The run is reported as
        # failed either way.
        if: ${{ !cancelled() }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Remove the cloned upstream repositories
          rm -rf consensus-specs/ execution-specs/

          # Staging first so the check covers new files as well as modified ones
          git add specs/

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Update nightly specs"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
